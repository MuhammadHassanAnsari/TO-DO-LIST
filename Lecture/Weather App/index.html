<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
    <title>Weather</title>
</head>

<body>
    <nav>
        <ul>
            <li><i class="fa-regular fa-cloud" style="color: rgb(0, 0, 0);"></i> Weather App</li>
            <li>Live Weather</li>
        </ul>
    </nav>

    <main>
        <input type="text" id="search-city" placeholder="Enter City Name">
        <button class="search-btn">Search</button>
    </main>

    <article>
        <div class="weather-card">
            <div class="text">
                <h1 class="showcity"><i class="fa-solid fa-location-dot" style="color: rgb(0, 0, 0);"></i>&nbsp;Search
                    City...</h1>

                <h1 class="tempreature">--°C</h1>
                <p>Feels like <span class="feel-temp">--°C</span></p>
            </div>

            <div class="images">
                <img src="9bb1cab2-8b57-495a-bc39-2fd97183b4c7-removebg-preview.png" alt="">
            </div>
        </div>

        <div class="others-box">
            <div class="humdity-box">
                <div class="icon"><i class="fa-solid fa-2xl fa-droplet" style="color: rgb(46, 86, 132);"></i></div>
                <h4>Humidity</h4>
                <p class="humidity">--%</p>
            </div>

            <div class="tempreature-box">
                <div class="icon1"><i class="fa-solid fa-2xl fa-thermometer" style="color: #B8552D;"></i></div>
                <h4>Tempreature</h4>
                <p class="tempreature1">--°C</p>

            </div>

            <div class="windspeed-box">
                <div class="icon2"><i class="fa-solid fa-2xl fa-wind" style="color: #32573A;"></i></div>
                <h4>Wind speed</h4>
                <p class="wind">-- km/h</p>
            </div>

        </div>

    </article>
</body>

<script src="script.js"></script>

</html>
