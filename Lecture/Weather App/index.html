<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Weather</title>
</head>

<body>
    <nav>
        <ul>
            <li>Weather App</li>
        </ul>
    </nav>

    <main>
        <input type="text" id="search-city" placeholder="Enter City Name">
        <button class="search-btn">Search</button>
    </main>

    <article>
        <div class="weather-card">
            <h1 class="showcity">Search City...</h1>
            <p>Tuesday</p>

            <h1 class="tempreature">--°C</h1>
            <p>Feels like <span class="feel-temp">--°C</span></p>
        </div>

        <div class="others-box">
            <h4>Humidity</h4>
            <p class="humidity">--%</p>

            <h4>Tempreature</h4>
            <p class="tempreature">--°C</p>

            <h4>Wind speed</h4>
            <p class="wind">-- km/h</p>

        </div>

    </article>
</body>

<script src="script.js"></script>

</html>
